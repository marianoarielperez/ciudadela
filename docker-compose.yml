services:
  db:
    image: mariadb:10.11
    container_name: sigev-db
    ports:
      # Solo loopback: sin el prefijo, Docker publica el puerto en todas las
      # interfaces y la base de desarrollo queda expuesta a la red local.
      - "127.0.0.1:3306:3306"
    environment:
      MARIADB_ROOT_PASSWORD: devroot
      MARIADB_DATABASE: sigev
      MARIADB_USER: sigev
      MARIADB_PASSWORD: sigev_dev
    volumes:
      - sigev_db:/var/lib/mysql
      # Crea sigev_shadow en la primera inicialización de un volumen vacío:
      - ./docker/mariadb-init:/docker-entrypoint-initdb.d:ro
volumes:
  sigev_db:
